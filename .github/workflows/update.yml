name: Daily AI Status Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-content-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Update Script
        run: |
          python - << 'EOF'
          import json, datetime, os, glob, re

          try:
              catalog_file = 'ai-catalog.json'
              if os.path.exists(catalog_file):
                  with open(catalog_file, 'r', encoding='utf-8') as f:
                      data = json.load(f)
              else:
                  data = {}

              categories = ['economy', 'country', 'political', 'glossary']
              monitored = {}

              for cat in categories:
                  if not os.path.isdir(cat):
                      raise FileNotFoundError(f"Expected catalog directory does not exist: {cat}")
                  files = glob.glob(os.path.join(cat, "*.json"))
                  latest_date = None
                  for fpath in files:
                      with open(fpath, 'r', encoding='utf-8') as jf:
                          raw = jf.read()
                          jdata = json.loads(raw)

                      root = jdata.get('structured_content_analysis', jdata)
                      pdate = (
                          root.get('editorial_frontend', {}).get('published_date')
                          or root.get('metadata', {}).get('published_date')
                          or jdata.get('editorial_frontend', {}).get('published_date')
                          or jdata.get('metadata', {}).get('published_date')
                      )

                      if not pdate:
                          found_dates = re.findall(r'202\d-\d{2}-\d{2}', raw)
                          if found_dates:
                              pdate = max(found_dates)

                      if pdate and (latest_date is None or pdate > latest_date):
                          latest_date = pdate

                  monitored[cat] = {
                      "total_payloads": len(files),
                      "last_updated": latest_date,
                      "endpoint": f"https://analysisreports.github.io/{cat}/"
                  }

              data['last_updated'] = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d')
              data['monitored_directories'] = monitored

              with open(catalog_file, 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
              print('ai-catalog.json güncellendi.')
          except Exception as e:
              print('Hata:', e)
              raise
          EOF

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ai-catalog.json
          git diff-index --quiet HEAD || git commit -m "Auto update AI status [skip ci]"
          git push
