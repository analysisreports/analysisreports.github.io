name: Sync Data & Ontologies to Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync_to_hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4

      - name: Install Hugging Face Hub
        run: pip install huggingface_hub

      - name: Ensure Valid Hugging Face YAML in README.md
        run: |
          python - << 'EOF'
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read().lstrip()

          if not content.startswith('---'):
              yaml_header = '''---
          language:
            - en
            - tr
          license: other
          license_name: cc-by-nc-nd-4.0
          license_link: LICENSE.md
          task_categories:
            - text-generation
          tags:
            - macroeconomics
            - geopolitics
            - knowledge-graph
            - llm-context
            - quantitative-finance
          pretty_name: Analysis Reports
          viewer: false
          ---

          '''
              yaml_header = '\n'.join(line[10:] if line.startswith('          ') else line for line in yaml_header.splitlines()) + '\n'
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(yaml_header + content)
          EOF

      - name: Upload Clean Dataset Structure to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ['HF_TOKEN'])
          api.upload_folder(
              folder_path='.',
              repo_id='analysisreports/analysisreports',
              repo_type='dataset',
              ignore_patterns=[
                  '.git/*', '.git/**',
                  '.github/*', '.github/**',
                  '.vscode/*', '.vscode/**',
                  '_includes/*', '_includes/**',
                  '.gitignore',
                  '_config.yml'
              ],
              commit_message='Auto-sync dataset structure from GitHub'
          )
          EOF