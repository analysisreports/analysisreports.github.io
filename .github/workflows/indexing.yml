name: Notify Bots & Indexing Services

on:
  push:
    branches:
      - main
    paths:
      - 'economy/**'
      - 'country/**'
      - 'political/**'
      - 'concept/**'
      - 'glossary/**'
      - 'editorial/**'
      - 'political-country/**'
      - 'llms*.txt'
      - 'llms*.json'
      - 'sitemap.xml'
      - 'index.html'
  workflow_dispatch:

jobs:
  ping-indexing-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. BÖLÜM: Google & Gemini İçin WebSub (PubSubHubbub) Sinyali
      - name: Ping WebSub / PubSubHubbub (Google & Gemini)
        run: |
          curl --silent --show-error --fail-with-body -X POST https://pubsubhubbub.appspot.com/ \
            -d "hub.mode=publish" \
            -d "hub.url=https://www.ersoytoptas.tr/feeds/posts/default?alt=rss"
          curl --silent --show-error --fail-with-body -X POST https://pubsubhubbub.appspot.com/ \
            -d "hub.mode=publish" \
            -d "hub.url=https://en.ersoytoptas.tr/feeds/posts/default?alt=rss"
          echo "Google ve Gemini botları için WebSub üzerinden RSS anonsu geçildi."

      # 2. BÖLÜM: Bing Webmaster Tools API ile Bing, Copilot ve ChatGPT İndeksleme (Her İki Doğrulanmış Mülk İçin)
      - name: Submit URLs to Bing Webmaster Tools API
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: |
          if [ -n "$BING_API_KEY" ]; then
            # 1. Mülk: analysisreports.github.io
            RESPONSE_1=$(curl --silent --write-out "\nHTTP_STATUS:%{http_code}" -X POST "https://ssl.bing.com/webmaster/api.svc/json/SubmitUrlbatch?apikey=${BING_API_KEY}" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d '{
                "siteUrl": "https://analysisreports.github.io",
                "urlList": [
                  "https://analysisreports.github.io/",
                  "https://analysisreports.github.io/index.html",
                  "https://analysisreports.github.io/llms.txt",
                  "https://analysisreports.github.io/llms-sitrep.txt",
                  "https://analysisreports.github.io/llms-sitrep.json",
                  "https://analysisreports.github.io/llms-news.txt",
                  "https://analysisreports.github.io/llms-news.json",
                  "https://analysisreports.github.io/llms-formulas.txt",
                  "https://analysisreports.github.io/sitemap.xml"
                ]
              }')
            BODY_1=$(echo "$RESPONSE_1" | sed -e '$d')
            STATUS_1=$(echo "$RESPONSE_1" | tail -n1 | sed -e 's/HTTP_STATUS://')
            if [ "$STATUS_1" -ge 200 ] && [ "$STATUS_1" -lt 300 ]; then
              echo "Bing API: analysisreports.github.io başarıyla gönderildi."
            elif echo "$BODY_1" | grep -qi "Quota"; then
              echo "Bing API: Günlük kota doldu (analysisreports.github.io), yarın sıfırlandığında devam edilecek."
            else
              echo "Bing API Bildirimi (HTTP $STATUS_1): $BODY_1"
            fi

            # 2. Mülk: www.ersoytoptas.tr
            RESPONSE_2=$(curl --silent --write-out "\nHTTP_STATUS:%{http_code}" -X POST "https://ssl.bing.com/webmaster/api.svc/json/SubmitUrlbatch?apikey=${BING_API_KEY}" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d '{
                "siteUrl": "https://www.ersoytoptas.tr",
                "urlList": [
                  "https://www.ersoytoptas.tr/",
                  "https://en.ersoytoptas.tr/"
                ]
              }')
            BODY_2=$(echo "$RESPONSE_2" | sed -e '$d')
            STATUS_2=$(echo "$RESPONSE_2" | tail -n1 | sed -e 's/HTTP_STATUS://')
            if [ "$STATUS_2" -ge 200 ] && [ "$STATUS_2" -lt 300 ]; then
              echo "Bing API: www.ersoytoptas.tr başarıyla gönderildi."
            elif echo "$BODY_2" | grep -qi "Quota"; then
              echo "Bing API: Günlük kota doldu (www.ersoytoptas.tr), yarın sıfırlandığında devam edilecek."
            else
              echo "Bing API Bildirimi (HTTP $STATUS_2): $BODY_2"
            fi
          else
            echo "BING_API_KEY secret bulunamadı, adım atlandı."
          fi
