name: FRED and ECB Series Daily and On-Push Sync

on:
  schedule:
    # Her gün piyasalar kapandıktan sonra gece 00:00 UTC'de otomatik çalışır
    - cron: '0 0 * * *'
  push:
    # llms-fred-series.txt veya scriptler değiştiğinde tetiklenir
    paths:
      - 'llms-fred-series.txt'
      - 'llms-ecb-series.txt'
      - 'scripts/**'
  workflow_dispatch:
    # Elle çalıştırma butonu

permissions:
  contents: write

jobs:
  sync-fred:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Macro, Dynamic Relationships & Quantitative Models Engine
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/update_fred_series.py
          python scripts/update_ecb_series.py
          python scripts/update_worldbank_series.py
          python scripts/update_relationships.py
          python scripts/calculate_models.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add llms-fred-series.txt llms-fred-series.json llms-ecb-series.txt llms-ecb-series.json llms-relationships.txt llms-relationships.json llms-models.txt llms-models.json
          git diff-index --quiet HEAD || git commit -m "Auto update FRED and ECB series, relationships & quantitative models [skip ci]"
          git push
