name: FRED and ECB Series Daily Sync

on:
  schedule:
    # Her gün piyasalar kapandıktan sonra gece 00:00 UTC'de otomatik çalışır (Günde 1 kez)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Elle çalıştırma butonu

permissions:
  contents: write

concurrency:
  group: scheduled-content-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-fred:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Macro, Dynamic Relationships & Quantitative Models Engine
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          pip install xlrd
          python scripts/update_fred_series.py
          python scripts/update_ecb_series.py
          python scripts/update_worldbank_series.py
          python scripts/update_imf_series.py
          python scripts/update_nyfed_series.py
          python scripts/update_country_relationships.py
          python scripts/update_relationships.py
          python scripts/calculate_models.py
          python scripts/verify_cross_consistency.py
          python scripts/verify_entities.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add llms-fred-series.txt llms-fred-series.json llms-ecb-series.txt llms-ecb-series.json llms-worldbank-series.txt llms-worldbank-series.json llms-imf-series.txt llms-imf-series.json llms-nyfed-series.txt llms-nyfed-series.json llms-country-relationships.txt llms-country-relationships.json llms-relationships.txt llms-relationships.json llms-models.txt llms-models.json
          git diff-index --quiet HEAD || git commit -m "Auto update FRED, ECB, World Bank, IMF, NY Fed, Country Relationships, relationships & quantitative models [skip ci]"
          git push
