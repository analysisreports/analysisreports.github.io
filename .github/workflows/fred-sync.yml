name: FRED and ECB Series Daily Sync

on:
  schedule:
    # Her gün piyasalar kapandıktan sonra gece 00:00 UTC'de otomatik çalışır (Günde 1 kez)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Elle çalıştırma butonu

permissions:
  contents: write

concurrency:
  group: scheduled-content-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-fred:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Git Identity
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Stage 1 - Central Banks & Macro Series (FRED, ECB, NY Fed)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          pip install xlrd
          echo "Syncing FRED series..."
          python scripts/update_fred_series.py
          sleep 5
          echo "Syncing ECB series..."
          python scripts/update_ecb_series.py
          sleep 5
          echo "Syncing NY Fed series..."
          python scripts/update_nyfed_series.py
          
          git add llms-fred-series.txt llms-fred-series.json llms-ecb-series.txt llms-ecb-series.json llms-nyfed-series.txt llms-nyfed-series.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto update Central Banks & Macro series (FRED, ECB, NY Fed) [skip ci]"
            git pull --rebase origin main
            git push
            echo "Stage 1 push completed. Sleeping 30s..."
            sleep 30
          else
            echo "Stage 1: No changes detected."
          fi

      - name: Stage 2 - Commodities & Multilateral Series (EIA, World Bank, IMF)
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          echo "Syncing EIA series..."
          python scripts/update_eia_series.py
          sleep 5
          echo "Syncing World Bank series..."
          python scripts/update_worldbank_series.py
          sleep 5
          echo "Syncing IMF series..."
          python scripts/update_imf_series.py
          
          git add llms-eia-series.txt llms-eia-series.json llms-worldbank-series.txt llms-worldbank-series.json llms-imf-series.txt llms-imf-series.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto update Commodities & Multilateral series (EIA, World Bank, IMF) [skip ci]"
            git pull --rebase origin main
            git push
            echo "Stage 2 push completed. Sleeping 30s..."
            sleep 30
          else
            echo "Stage 2: No changes detected."
          fi

      - name: Stage 3 - Relationships & Quantitative Models Engine
        run: |
          echo "Syncing Country Relationships..."
          python scripts/update_country_relationships.py
          sleep 5
          echo "Syncing Multilateral Relationships..."
          python scripts/update_relationships.py
          sleep 5
          echo "Calculating Quantitative Models..."
          python scripts/calculate_models.py
          sleep 5
          echo "Verifying Cross-Consistency & Entities..."
          python scripts/verify_cross_consistency.py
          python scripts/verify_entities.py
          
          git add llms-country-relationships.txt llms-country-relationships.json llms-relationships.txt llms-relationships.json llms-models.txt llms-models.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto update Relationships & Quantitative Models [skip ci]"
            git pull --rebase origin main
            git push
            echo "Stage 3 push completed."
          else
            echo "Stage 3: No changes detected."
          fi
