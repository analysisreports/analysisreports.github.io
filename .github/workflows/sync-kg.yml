name: Sync Data & Ontologies to Kaggle

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync_to_kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle API
        run: pip install kaggle six

      - name: Configure Kaggle API Token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          echo "$KAGGLE_API_TOKEN" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Upload Clean Dataset to Kaggle (Hugging Face Mantığıyla)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python -c "
          import os
          import json
          from kaggle.api.kaggle_api_extended import KaggleApi

          # Kaggle API'yi başlat
          api = KaggleApi()
          api.authenticate()

          # Kaggle metadata dosyasını oluştur (Zorunlu kimlik kartı)
          metadata = {
              'title': 'Analysis Reports Data',
              'id': 'analysisreports/analysisreports',
              'licenses': [{'name': 'CC0-1.0'}]
          }
          with open('dataset-metadata.json', 'w') as f:
              json.dump(metadata, f)

          # Hugging Face'teki ignore mantığının birebiri: Bu dosyalar dışarıda kalacak
          ignore_patterns = [
              '.git', '.github', '.vscode', 
              '_includes', '.gitignore', 
              '_config.yml', 'README.md',
              'dataset-metadata.json'
          ]

          # Temiz klasör yapısını hazırla ve Kaggle'a bas
          try:
              api.dataset_create_version('.', 'Auto-sync dataset structure from GitHub', convert_to_csv=False, delete_old_versions=True)
          except Exception as e:
              print(f'Create deneniyor... Hata: {e}')
              api.dataset_create_new('.', public=False, convert_to_csv=False)
          "
