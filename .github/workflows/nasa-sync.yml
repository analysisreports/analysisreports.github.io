name: NASA FIRMS Satellite Kinetic Intelligence Sync

on:
  schedule:
    # Runs daily at 02:00 UTC (once every 24 hours)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-orbital-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch NASA FIRMS Satellite Telemetry & Build Contracts
        env:
          NASA_MAP_KEY: ${{ secrets.NASA_MAP_KEY }}
        run: |
          python scripts/update_nasa_firms.py
          python scripts/update_relationships.py

      - name: Commit and Push Orbital Intelligence Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add llms-nasa-firms.json llms-nasa-firms.txt llms-relationships.json llms-relationships.txt
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto update NASA FIRMS Satellite Telemetry [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes detected in NASA FIRMS telemetry."
          fi
