name: NASA FIRMS Satellite Kinetic Intelligence Sync

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-orbital-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch NASA FIRMS Satellite Telemetry & Build Contracts
        env:
          NASA_MAP_KEY: ${{ secrets.NASA_MAP_KEY }}
        run: |
          python scripts/update_nasa_firms.py

      - name: Commit and Push Orbital Intelligence Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add llms-nasa-firms.json llms-nasa-firms.txt
          git diff --staged --quiet || (git pull --rebase origin main && git commit -m "Auto update NASA FIRMS Satellite Telemetry [skip ci]" && git push)
