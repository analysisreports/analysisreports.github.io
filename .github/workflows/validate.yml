name: CI Payload & Schema Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JSON Payloads Syntax
        run: |
          python -c "
          import json, glob, sys
          errors = 0
          for f in glob.glob('**/*.json', recursive=True):
              try:
                  with open(f, 'r', encoding='utf-8') as fp:
                      json.load(fp)
              except Exception as e:
                  print(f'HATA: {f} -> {e}', file=sys.stderr)
                  errors += 1
          if errors > 0:
              sys.exit(1)
          print('Tüm JSON dosyaları geçerli.')
          "

      - name: Verify Canonical Entity IDs Integrity
        run: |
          python scripts/verify_entities.py

      - name: Verify Strict Zero Synthetic Data & Zero Fallbacks
        run: |
          python scripts/verify_zero_fallbacks.py

      - name: Verify WORKFLOW.md requirements for new items
        run: |
          python scripts/verify_workflow.py
        env:
          WORKFLOW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}

      - name: Test WORKFLOW.md compliance checks
        run: |
          python -m unittest discover -s scripts -p test_workflow.py

      - name: Run Read-Only Verification Suite
        run: |
          python scripts/verify_all.py

      - name: Verify Taylor GDP period alignment
        run: |
          python -m unittest discover -s scripts -p test_taylor_alignment.py

      - name: Verify macro triggers and FRED observation dates
        run: |
          python -m unittest discover -s scripts -p 'test_*trigger*.py'
          python -m unittest discover -s scripts -p test_fred_year_ago_date.py

      - name: Verify net Fed liquidity units
        run: |
          python -m unittest discover -s scripts -p test_net_fed_liquidity.py
