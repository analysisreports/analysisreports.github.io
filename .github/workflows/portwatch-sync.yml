name: IMF PortWatch Maritime Chokepoint & AIS Telemetry Sync

on:
  schedule:
    # Runs weekly on Wednesday at 03:00 UTC (captures Tuesday's published batch)
    - cron: '0 3 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-maritime-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch IMF PortWatch Chokepoint Telemetry
        run: |
          python scripts/update_portwatch.py
          python scripts/update_relationships.py

      - name: Commit and Push Maritime Intelligence Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add llms-portwatch.json llms-portwatch.txt llms-relationships.json llms-relationships.txt
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto update IMF PortWatch Maritime Chokepoint Telemetry [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes detected in IMF PortWatch AIS telemetry."
          fi
